openapi: 3.1.0
info:
  title: Petstore
  version: "1.0"
servers:
  - url: /api/v1
paths:
  /pets:
    get:
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100}
      responses:
        "200": {description: A list of pets}
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string, minLength: 1}
                species: {type: string, enum: [cat, dog, parrot]}
                age: {type: integer, minimum: 0}
      responses:
        "201": {description: Created}
  /pets/{id}:
    get:
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        "200": {description: A pet}
