# OpenShield in front of an application on port 3000.
#
# Start the demo upstream (`python3 upstream.py`), then the proxy from this
# directory (`openshield -c config.yaml`) and send requests to port 8080.
# README.md lists requests that exercise every rule below.

listen: "127.0.0.1:8080"
upstream: "http://127.0.0.1:3000"

logging:
  level: info
  format: text
  access_log: /dev/stdout
audit_log:
  path: /dev/stderr
  format: text
# Include the field values that made each rule match in the audit log.
log_payloads: true

# Per-request counters that rules add to and later rules check.
scores: [sqli, xss]

lists:
  - name: blocked_ips
    kind: ip
    items: ["203.0.113.0/24"]
  - name: scanner_ua
    kind: substring
    items: ["sqlmap", "nikto", "nmap"]

# JWTs signed with a shared secret; see README.md for minting one.
token_configurations:
  - id: api
    token_sources:
      - 'http.request.headers["authorization"][0]'
    credentials:
      keys:
        - kty: oct
          kid: demo
          alg: HS256
          # base64url of "openshield-demo-secret-change-me!"
          k: b3BlbnNoaWVsZC1kZW1vLXNlY3JldC1jaGFuZ2UtbWUh

# Requests under /api/v1 are checked against this OpenAPI document.
schemas:
  - name: petstore
    file: ./openapi/petstore.yaml

rulesets:
  # Detections are scored rather than blocked outright, so a later rule can
  # decide on the total.
  - name: detections
    description: Injection detection on query arguments
    rules:
      - id: sqli-args
        categories: [sqli]
        action: score
        expression: "any(detect_sqli(url_decode_uni(http.request.uri.args.values[*])))"
        action_parameters:
          scores: [{name: sqli, increment: 10}]
      - id: xss-args
        categories: [xss]
        action: score
        expression: "any(detect_xss(url_decode_uni(http.request.uri.args.values[*])))"
        action_parameters:
          scores: [{name: xss, increment: 10}]

  - name: main
    kind: root
    rules:
      - id: blocked-ips
        action: block
        expression: "ip.src in $blocked_ips"

      - id: scanners
        action: block
        expression: "http.user_agent in $scanner_ua"
        action_parameters:
          response: {status_code: 403, content: "scanner blocked"}

      # Five login attempts per minute per client, then a minute of blocking.
      - id: login-rate-limit
        action: block
        expression: 'http.request.method == "POST" and http.request.uri.path == "/login"'
        ratelimit:
          characteristics: [ip.src]
          period: 60
          requests_per_period: 5
          mitigation_timeout: 60
        action_parameters:
          response: {status_code: 429, content: "too many login attempts"}

      - id: run-detections
        action: execute
        expression: "true"
        action_parameters:
          id: detections

      # Scores are refreshed at the start of each phase, so the total is
      # checked one phase after the detections ran.
      - id: block-injection
        phase: request_body
        action: block
        expression: "score.sqli >= 10 or score.xss >= 10"
        action_parameters:
          response: {status_code: 403, content: "injection detected"}

      - id: private-needs-jwt
        action: block
        expression: 'starts_with(http.request.uri.path, "/api/private/") and not is_jwt_valid("api")'
        action_parameters:
          response: {status_code: 401, content: "valid token required"}

      - id: unknown-api-endpoint
        action: block
        expression: 'starts_with(http.request.uri.path, "/api/v1/") and not schema_validation.operation.matched'
        action_parameters:
          response: {status_code: 404, content: "unknown endpoint"}

      - id: invalid-api-request
        action: block
        expression: "schema_validation.violated"
        action_parameters:
          response: {status_code: 400, content: "request does not match the API schema"}

      - id: invalid-api-body
        phase: request_body
        action: block
        expression: "schema_validation.violated"
        action_parameters:
          response: {status_code: 400, content: "body does not match the API schema"}
